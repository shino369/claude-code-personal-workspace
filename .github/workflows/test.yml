name: Test CI

on:
  # One run per commit: pushes to the protected branches, and PRs into them.
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # Any other branch, before a PR: gh workflow run test.yml --ref <branch>
  workflow_dispatch:

# A new push cancels the older run of the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}, Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Report every OS even when one fails: the harness runs on Windows too.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The single check the main/develop ruleset requires ("Test on Node.js 24.x").
  # It passes only when every OS in the matrix passed, so the matrix can change
  # without editing the ruleset.
  required:
    name: Test on Node.js 24.x
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the matrix result
        shell: bash
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix result: ${{ needs.test.result }}"
            exit 1
          fi
