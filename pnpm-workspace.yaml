packages:
  - .

catalogs:
  dev:
    '@playwright/test': ^1.65.0
    '@types/chrome': ^0.3.7
    '@types/node': ^24.19.2
    '@vitest/coverage-v8': ^5.1.0
    '@vitest/ui': ^5.1.0
    agent-browser: ^0.42.0
    eslint: ^9.39.5
    eslint-config-prettier: ^10.1.8
    globals: ^17.14.0
    playwright: ^1.65.0
    prettier: ^3.9.10
    typescript: ^7.0.2
    vite: ^8.3.7
    vitest: ^5.1.0

minimumReleaseAge: 10080

allowBuilds:
  # agent-browser's postinstall downloads the browser; the README uses the
  # explicit `pnpm exec agent-browser install` step instead.
  agent-browser: false
  esbuild: true

engineStrict: true

strictPeerDependencies: true

trustPolicy: no-downgrade

permissions:
  agent-browser:
    skills: true
